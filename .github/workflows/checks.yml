name: CPU contracts and docs
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s bridge/tests -v
      - run: python scripts/check_docs.py
      - run: python scripts/summarize_turn_eval.py > /tmp/turn-results.md && diff -u docs/experiments/2026-10-19-turn/RESULTS.md /tmp/turn-results.md
      - run: python -m ruff check --select E4,E7,E9,F,I bridge/voice_bridge.py bridge/audio_codec.py bridge/turn_detection.py bridge/stream_tail.py bridge/tests scripts
      - run: python -m ruff format --check bridge/audio_codec.py bridge/turn_detection.py bridge/stream_tail.py bridge/tests scripts
